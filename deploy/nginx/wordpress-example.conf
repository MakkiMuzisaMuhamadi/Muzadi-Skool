# Example: a WordPress site on the same VPS. It has its OWN domain, so it never
# clashes with *.muzaditechnologies.com. Copy per site, change server_name/root.
server {
    listen 443 ssl http2;
    server_name example-client.org www.example-client.org;
    root /var/www/example-client.org;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/example-client.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-client.org/privkey.pem;
    client_max_body_size 64m;

    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}
