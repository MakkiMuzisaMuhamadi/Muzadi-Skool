# /etc/nginx/sites-available/school360   (ln -s to sites-enabled)
#
# One block serves EVERY school: stmarys.muzaditechnologies.com, kings.muzaditechnologies.com ...
# plus admin.muzaditechnologies.com (you). Adding a school needs no nginx change.
# Your WordPress sites keep their own server blocks (see wordpress-example.conf).

upstream school360_app {
    server unix:/run/school360/gunicorn.sock fail_timeout=0;
}

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name muzaditechnologies.com *.muzaditechnologies.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muzaditechnologies.com *.muzaditechnologies.com;

    # ONE wildcard certificate for all schools (see DEPLOYMENT.md, step 5)
    ssl_certificate     /etc/letsencrypt/live/muzaditechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzaditechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;          # Excel uploads, photos
    access_log /var/log/nginx/school360.access.log;
    error_log  /var/log/nginx/school360.error.log;

    # Maintenance page while deploy.sh runs migrations
    if (-f /srv/school360/maintenance.on) { return 503; }
    error_page 503 @maintenance;
    location @maintenance {
        root /srv/school360/app/deploy/nginx;
        rewrite ^ /maintenance.html break;
    }

    location = /favicon.ico {
        alias /srv/school360/app/staticfiles/images/favicon.ico;
        access_log off; log_not_found off; expires 30d;
    }

    # CSS / JS / images (collectstatic)
    location /static/ {
        alias /srv/school360/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded files are PRIVATE. /media/... goes to Django, which checks the
    # school and then answers "X-Accel-Redirect: /protected-media/..."; only then
    # does nginx send the file from here. Nobody can open /protected-media/ directly.
    location /protected-media/ {
        internal;
        alias /srv/school360/app/media/;
    }

    location / {
        proxy_pass http://school360_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
