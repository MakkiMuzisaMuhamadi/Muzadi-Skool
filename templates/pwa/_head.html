{% load static %}
  <!-- Installable app (PWA): see mainApp/views/pwa_views.py -->
  <link rel="manifest" href="{% url 'pwa_manifest' %}">
  <!-- Muzadi "M" logo as the browser-tab icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'pwa/icons/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'pwa/icons/favicon-16.png' %}">
  <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="any">
  <meta name="theme-color" content="#1e6fd9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="{{ short_name|default:'Muzadi' }}">
  <!-- iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ short_name|default:'Muzadi' }}">
  <link rel="apple-touch-icon" href="{% static 'pwa/icons/apple-touch-icon.png' %}">
