<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ school_name|default:"School System" }}{% endblock %}</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7fb; --card:#fff; --accent:#4b49ac; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; max-width:520px; width:100%; padding:32px 28px; text-align:center; }
    .icon { font-size:44px; line-height:1; margin-bottom:12px; }
    h1 { font-size:22px; margin:0 0 10px; }
    p { color:var(--muted); line-height:1.55; margin:0 0 14px; }
    a.btn, button.btn { display:inline-block; margin-top:8px; padding:10px 18px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; border:0; font-size:15px; cursor:pointer; }
    a.link { color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap"><div class="card">{% block body %}{% endblock %}</div></div>
</body>
</html>
