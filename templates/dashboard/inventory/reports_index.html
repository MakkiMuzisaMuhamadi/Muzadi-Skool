{% extends "dashboard/base.html" %}
{% block content %}
<div class="page-header mb-3">
  <h3 class="page-title mb-0"><i class="fas fa-chart-bar"></i> Inventory reports</h3>
  <small class="text-muted">Every report can be filtered and downloaded as CSV for Excel.</small>
</div>
<div class="row">
  {% for group, items in menu %}
  <div class="col-md-4 mb-3">
    <div class="card h-100"><div class="card-body">
      <h5>{{ group }}</h5>
      <div class="list-group list-group-flush">
        {% for key, label in items %}<a class="list-group-item list-group-item-action px-0" href="{% url 'inv_report' key %}">{{ label }}</a>{% endfor %}
      </div>
    </div></div>
  </div>
  {% endfor %}
</div>
{% endblock %}
