{% extends "dashboard/base.html" %}
{% block content %}
<div class="page-header mb-3">
  <h3 class="page-title mb-0">{{ title }}</h3>
</div>
<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <p>{{ message }}</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">{{ confirm_label|default:"Confirm" }}</button>
          <a href="{{ cancel_url }}" class="btn btn-light">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
