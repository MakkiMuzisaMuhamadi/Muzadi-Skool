{% if field.is_hidden %}{{ field }}{% else %}
<div class="mb-3">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
  {% else %}
    <label class="form-label font-weight-bold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="form-text text-muted">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
{% endif %}
