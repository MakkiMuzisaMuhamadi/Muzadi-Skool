{% if page.paginator.num_pages > 1 %}
<div class="d-flex justify-content-between align-items-center mt-3">
  <div class="text-muted small">Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} records)</div>
  <div class="btn-group">
    {% if page.has_previous %}
      <a class="btn btn-outline-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Previous</a>
    {% endif %}
    {% if page.has_next %}
      <a class="btn btn-outline-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Next</a>
    {% endif %}
  </div>
</div>
{% endif %}
