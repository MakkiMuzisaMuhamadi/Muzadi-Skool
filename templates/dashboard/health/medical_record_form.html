{% extends "dashboard/base.html" %}
{% load static %}
{% block content %}
<div class="page-header mb-3 d-flex align-items-center justify-content-between">
  <div>
    <h3 class="page-title mb-0"><i class="fas fa-file-medical text-info"></i> {{ title }}</h3>
    <small class="text-muted">{{ student.name }} — {{ student.admission_number }}</small>
  </div>
  <div>
    <a href="{% url 'health_medical_records' %}" class="btn btn-outline-primary btn-sm">
      <i class="fas fa-arrow-left mr-1"></i> Back
    </a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}

      <div class="row">
        <div class="col-md-4">
          <label class="small text-muted mb-1">Blood Group</label>
          {{ form.blood_group }}
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label class="small text-muted mb-1">Known Allergies</label>
          {{ form.known_allergies }}
        </div>
        <div class="col-md-6">
          <label class="small text-muted mb-1">Special Needs</label>
          {{ form.special_needs }}
        </div>
      </div>

      <div class="mt-3">
        <label class="small text-muted mb-1">Dietary Restrictions</label>
        {{ form.dietary_restrictions }}
      </div>

      <div class="mt-4 d-flex" style="gap:.5rem;">
        <button class="btn btn-success">
          <i class="fas fa-save mr-1"></i> {{ action }}
        </button>
        <a href="{% url 'health_medical_records' %}" class="btn btn-light">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
