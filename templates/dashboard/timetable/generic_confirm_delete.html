{% extends "dashboard/base.html" %}
{% block content %}
<div class="page-header mb-4">
  <h3 class="page-title mb-1"><i class="fas fa-trash mr-2 text-danger"></i> Delete {{ cfg.singular }}</h3>
</div>
<div class="card">
  <div class="card-body">
    <p class="mb-4">Delete <strong>{{ obj }}</strong>? This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, Delete</button>
      <a href="{{ back_url }}" class="btn btn-light border">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
