<!-- templates/uce/partials/account_modals.html -->
<!-- Change Username Modal -->
<div class="modal fade" id="usernameModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form method="POST" action="{% url 'change_username' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Change Username</h5>
          <button type="button" class="close" data-dismiss="modal">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- Show current username -->
          <div class="form-group">
            <label for="currentUsername">Current Username</label>
            <input type="text" class="form-control" id="currentUsername" 
                   value="{{ request.user.username }}" readonly disabled>
            <small class="form-text text-muted">Your current username</small>
          </div>
          
          <div class="form-group">
            <label for="newUsername">New Username</label>
            <input type="text" class="form-control" id="newUsername" name="new_username" required
                   placeholder="Enter your new username">
          </div>
          <div class="form-group">
            <label for="passwordConfirmUsername">Confirm Password</label>
            <input type="password" class="form-control" id="passwordConfirmUsername" 
                   name="password" placeholder="Enter your password to confirm changes" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-info" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-success">Update Username</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Change Email Modal -->

<div class="modal fade" id="emailModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form method="POST" action="{% url 'change_email' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Change Email Address</h5>
          <button type="button" class="close" data-dismiss="modal">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <!-- ADD THIS: Show current email -->
          <div class="form-group">
            <label for="currentEmail">Current Email Address</label>
            <input type="email" class="form-control" id="currentEmail" 
                   value="{{ request.user.email|default:'No email set' }}" readonly disabled>
            <small class="form-text text-muted">Your current email address</small>
          </div>
          
          <div class="form-group">
            <label for="newEmail">New Email Address</label>
            <input type="email" class="form-control" id="newEmail" name="new_email" required
                   placeholder="Enter your new email address">
          </div>
          <div class="form-group">
            <label for="passwordConfirmEmail">Confirm Password</label>
            <input type="password" class="form-control" id="passwordConfirmEmail" 
                   name="password" placeholder="Enter your password to confirm changes" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-info" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-success">Update Email</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div class="modal fade" id="passwordModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form method="POST" action="{% url 'change_password' %}">
        {% csrf_token %}

          <button type="button" class="close" data-dismiss="modal">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" class="form-control" id="currentPassword" 
                   name="current_password" required>
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" class="form-control" id="newPassword" 
                   name="new_password" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" 
                   name="confirm_password" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-info" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-success">Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
