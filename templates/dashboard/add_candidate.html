<!-- templates/uce/add_candidate.html -->
{% extends 'dashboard/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">
                    <i class="fas fa-user-plus me-2"></i>Add New Candidate
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_school" class="form-label">School</label>
                        {{ form.school }}
                        {% if form.school.errors %}
                        <div class="text-danger">{{ form.school.errors }}</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label for="id_name" class="form-label">Name</label>
                        {{ form.name }}
                        {% if form.name.errors %}
                        <div class="text-danger">{{ form.name.errors }}</div>
                        {% endif %}
                    </div> 
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'uce_candidate_list' %}" class="btn btn-info me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Candidate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
