{% extends "dashboard/base.html" %}
{% block content %}

<div class="page-header mb-3 d-flex align-items-center justify-content-between">
  <div>
    <h3 class="page-title mb-0"><i class="fas fa-bullhorn"></i> Release Results</h3>
    <small class="text-muted">{{ exam.title }}</small>
  </div>
  <div>
    <a href="{% url 'teacher_exam_list' %}" class="btn btn-outline-secondary btn-sm">
      <i class="fas fa-arrow-left mr-1"></i> Back
    </a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="alert alert-warning">
      This will allow students to view their final marks (for this exam).
    </div>

    <form method="post">
      {% csrf_token %}
      <button class="btn btn-success" type="submit">
        <i class="fas fa-check mr-1"></i> Yes, Release Results
      </button>
    </form>

    {% if exam.results_released %}
      <div class="alert alert-success mt-3 mb-0">
        Results already released on {{ exam.results_released_at }}.
      </div>
    {% endif %}
  </div>
</div>

{% endblock %}
