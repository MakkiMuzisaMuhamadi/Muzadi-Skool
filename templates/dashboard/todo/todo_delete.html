{% extends "dashboard/base.html" %}
{% block content %}

<div class="page-header mb-3">
  <h3 class="page-title mb-0"><i class="fas fa-trash"></i> Delete Task</h3>
</div>

<div class="card">
  <div class="card-body">
    <p>Are you sure you want to delete <b>{{ item.title }}</b>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'todo_list' %}" class="btn btn-primary">Cancel</a>
    </form>
  </div>
</div>

{% endblock %}
