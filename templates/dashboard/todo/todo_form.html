{% extends "dashboard/base.html" %}
{% block content %}

<div class="page-header mb-3">
  <h3 class="page-title mb-0"><i class="fas fa-tasks"></i> {{ title }}</h3>
</div>

<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row">
        {% for field in form %}
        <div class="col-md-6 mb-3">
          <label>{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">{{ field.errors|striptags }}</div>
          {% endif %}
        </div>
        {% endfor %}
      </div>

      <button type="submit" class="btn btn-primary">Save Task</button>
      <a href="{% url 'todo_list' %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>

{% endblock %}
